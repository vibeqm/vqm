name: check
on: [push, pull_request]
jobs:
  check:
    # VibeQM Level 2: the same checks as the committed hooks, on every change.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: make check MDL="npx --yes markdownlint-cli2@0.23.3"
  security:
    # Secret scanning and static security analysis on every change. Read-only token;
    # gitleaks verified against its published checksum, semgrep pinned to an exact version.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: gitleaks 8.30.1, checksum-verified (secret scanning, whole history)
        run: |
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: semgrep 1.180.0, pinned (static security analysis)
        run: pipx run --spec "semgrep==1.180.0" semgrep scan --config p/secrets --config p/github-actions --error --metrics=off .
  self-assessment:
    # We run the assessment on ourselves: the report is on this run's summary page.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: vibeqm/vibeqm-check@e1ea5f66b50fab8efd41eed6ac6dfbb4706605c7 # v0.4.11
